    <style>
        * {

            padding: 0;

            height: 140px;

        }

            align-items: center;
            gap: 6px;
            margin-top: 8px;
            line-height: 1.15;
        }

            width: 18px;
            height: 18px;
            flex-shrink: 0;
            display: block;
        }

            color: #107c10;
            font-size: 17.5px;
            font-weight: 700;
            letter-spacing: 0.1px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .season-text {
            margin-left: 24px;
            margin-top: 2px;
            color: #767676;
            font-size: 16.5px;
            font-weight: 600;
            letter-spacing: 0.1px;
            line-height: 1.2;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .details-block {
            margin-top: 16px;
            font-size: 13px;
            line-height: 1.48;
        }
        .detail-id {
            color: #111111;
            font-weight: 700;
        }
        .detail-name {
            color: #107c10;
            font-weight: 600;
            text-transform: uppercase;
        }
